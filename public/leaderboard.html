<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c9f3e4">
<title>Leaderboard — AustinPay</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/austin-ui.css">
  <link rel="stylesheet" href="/css/austin-desktop.css">
  <link rel="stylesheet" href="/fa/css/all.min.css">
  <style>
    /* Override global .table (min-width:560px + nowrap) khusus di halaman
       leaderboard supaya rank/nama/nilai muat sejajar tanpa perlu geser. */
    .leaderboard-table-wrapper { overflow-x: visible; }
    .leaderboard-table { min-width: 0; width: 100%; table-layout: fixed; }
    .leaderboard-table th:nth-child(1),
    .leaderboard-table td:nth-child(1) { width: 34px; padding-right: 4px; }
    .leaderboard-table th:nth-child(2),
    .leaderboard-table td:nth-child(2) { white-space: normal; word-break: break-word; padding-left: 6px; padding-right: 6px; }
    .leaderboard-table th:nth-child(3),
    .leaderboard-table td:nth-child(3) { width: auto; white-space: nowrap; text-align: right; padding-left: 4px; }
    @media (max-width: 480px) {
      .leaderboard-table th, .leaderboard-table td { padding-top: 8px; padding-bottom: 8px; font-size: 12px; }
      .leaderboard-table th:nth-child(3), .leaderboard-table td:nth-child(3) { font-size: 12.5px; }
    }
  </style>
</head>
<body>
<div class="app-layout">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><div class="logo-icon"><i class="fas fa-bolt"></i></div><span>Austin Pay</span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Menu Utama</div>
      <div class="nav-item" data-href="/dashboard"><span class="nav-icon"><i class="fas fa-home"></i></span> Dashboard</div>
      <div class="nav-item" data-href="/saweria"><span class="nav-icon"><i class="fas fa-hand-holding-heart"></i></span> Saweria</div>
      <div class="nav-item" data-href="/deposit"><span class="nav-icon"><i class="fas fa-download"></i></span> Deposit</div>
      <div class="nav-item" data-href="/withdraw"><span class="nav-icon"><i class="fas fa-upload"></i></span> Withdraw</div>
      <div class="nav-item" data-href="/history"><span class="nav-icon"><i class="fas fa-history"></i></span> Riwayat</div>
      <div class="nav-item" data-href="/overview"><span class="nav-icon"><i class="fas fa-gauge-high"></i></span> Overview</div>
      <div class="nav-item active" data-href="/leaderboard"><span class="nav-icon"><i class="fas fa-trophy"></i></span> Leaderboard</div>
      <div class="nav-item" data-href="/profile"><span class="nav-icon"><i class="fas fa-user"></i></span> Profil</div>
      <div class="nav-item" data-href="/download-apk"><span class="nav-icon"><i class="fas fa-mobile-screen-button"></i></span> Download APK</div>
      <div class="nav-item" data-href="/api-settings"><span class="nav-icon"><i class="fas fa-code"></i></span> API Docs</div>
      <div class="nav-item" data-href="/webhook"><span class="nav-icon"><i class="fas fa-satellite-dish"></i></span> Webhook</div>
      <div class="nav-item" data-href="/notification"><span class="nav-icon"><i class="fas fa-bell"></i></span> Notifikasi</div>
      <div class="nav-item" data-href="/feedback"><span class="nav-icon"><i class="fas fa-comment-dots"></i></span> Feedback</div>
      <div class="nav-item" data-href="/penghargaan"><span class="nav-icon"><i class="fas fa-award"></i></span> Penghargaan</div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar" data-user-avatar></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" data-user-name>...</div>
          <div class="sidebar-user-role" data-user-role>Member</div>
        </div>
      </div>
      <div class="nav-item mt-8" data-logout style="color:#ef4444"><span class="nav-icon"><i class="fas fa-sign-out-alt"></i></span> Keluar</div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">Leaderboard</div>
      <div class="topbar-actions">
        <div class="notif-bell-wrapper">
          <button class="btn-icon" id="notif-bell"><i class="fas fa-bell"></i></button>
          <span class="notif-badge" id="notif-badge"></span>
        </div>
        <button class="btn-icon" id="theme-toggle"><i class="fas fa-moon"></i></button>
      </div>
    </header>

    <div class="page-content">
      <!-- Tabs -->
      <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" id="tab-deposit" onclick="switchTab('deposit')"><i class="fas fa-coins"></i> Top Deposit</button>
        <button class="btn btn-outline btn-sm" id="tab-deposit_monthly" onclick="switchTab('deposit_monthly')"><i class="fas fa-calendar-check"></i> Top Bulanan</button>
        <button class="btn btn-outline btn-sm" id="tab-transactions" onclick="switchTab('transactions')"><i class="fas fa-arrow-right-arrow-left"></i> Top Transaksi</button>
        <button class="btn btn-outline btn-sm" id="tab-balance" onclick="switchTab('balance')"><i class="fas fa-wallet"></i> Top Saldo</button>
        <button class="btn btn-outline btn-sm" id="tab-saweria" onclick="switchTab('saweria')"><i class="fas fa-hand-holding-heart"></i> Top Saweria</button>
      </div>

      <!-- My rank banner -->
      <div class="card mb-16" id="my-rank-card" style="display:none">
        <div class="card-body" style="display:flex;align-items:center;gap:14px">
          <div id="my-rank-badge" style="width:44px;height:44px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0">-</div>
          <div>
            <div class="text-sm text-muted">Posisimu saat ini</div>
            <div style="font-weight:700" id="my-rank-text">-</div>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="card">
        <div class="card-header">
          <span class="card-title" id="table-title">Top Deposit</span>
          <span class="text-muted text-sm" id="total-info"></span>
        </div>
        <div class="table-wrapper leaderboard-table-wrapper">
          <table class="table leaderboard-table">
            <thead>
              <tr>
                <th style="width:40px">Rank</th>
                <th>Nama</th>
                <th style="text-align:right" id="value-col-label">Total Deposit</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr><td colspan="3"><div class="loading-spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/dock.js"></script>
<script src="/js/push.js"></script>
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
<script src="/js/cs.js"></script>
<script>
let currentTab = 'deposit';

const TABS = {
  deposit:         { label: 'Top Deposit',  valueLabel: 'Total Deposit',    format: (v) => formatRupiah(v) },
  deposit_monthly: { label: 'Top Bulanan',  valueLabel: 'Deposit Bulan Ini', format: (v) => formatRupiah(v) },
  transactions:    { label: 'Top Transaksi', valueLabel: 'Jumlah Transaksi', format: (v) => `${v}x` },
  balance:         { label: 'Top Saldo',    valueLabel: 'Saldo Wallet',     format: (v) => formatRupiah(v) },
  // [BARU — Saweria] Sepanjang masa (bukan bulanan) — lihat computeMonthlySaweria()
  // di awards.controller.js untuk versi bulanannya (ada di halaman Penghargaan).
  saweria:         { label: 'Top Saweria',   valueLabel: 'Total Saweria',    format: (v) => formatRupiah(v) },
};

const RANK_STYLE = {
  1: { bg: '#fef3c7', color: '#92400e', icon: 'fa-trophy' },
  2: { bg: '#e5e7eb', color: '#374151', icon: 'fa-medal' },
  3: { bg: '#fed7aa', color: '#9a3412', icon: 'fa-medal' },
};

async function init() {
  const res = await Auth.check();
  if (!res) return;
  Auth.renderUserInfo(res.user, res.wallet);
  updateTabUI();
  loadData();
}

function switchTab(tab) {
  currentTab = tab;
  updateTabUI();
  loadData();
}

function updateTabUI() {
  Object.keys(TABS).forEach(t => {
    const btn = document.getElementById(`tab-${t}`);
    const icon = btn.querySelector('i').outerHTML;
    btn.className = t === currentTab ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
    btn.innerHTML = `${icon} ${TABS[t].label}`;
  });
  document.getElementById('table-title').textContent = TABS[currentTab].label;
  document.getElementById('value-col-label').textContent = TABS[currentTab].valueLabel;
}

function rankCell(rank) {
  const style = RANK_STYLE[rank];
  if (!style) return `<div style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text-muted)">${rank}</div>`;
  return `<div style="width:32px;height:32px;border-radius:50%;background:${style.bg};color:${style.color};display:flex;align-items:center;justify-content:center"><i class="fas ${style.icon}"></i></div>`;
}

async function loadData() {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = `<tr><td colspan="3"><div class="loading-spinner"></div></td></tr>`;
  document.getElementById('my-rank-card').style.display = 'none';

  const res = await API.get(`/api/leaderboard?type=${currentTab}`);

  if (!res.success) {
    tbody.innerHTML = `<tr><td colspan="3" class="table-empty">Gagal memuat data</td></tr>`;
    return;
  }

  document.getElementById('total-info').textContent = `Top ${res.data.length}`;

  if (!res.data.length) {
    tbody.innerHTML = `<tr><td colspan="3"><div class="table-empty"><i class="fas fa-inbox" style="font-size:36px;margin-bottom:12px;display:block;color:var(--text-muted)"></i><p>Belum ada data</p></div></td></tr>`;
  } else {
    const fmt = TABS[currentTab].format;
    tbody.innerHTML = res.data.map(row => `
      <tr style="${row.is_me ? 'background:var(--primary-light)' : ''}">
        <td>${rankCell(row.rank)}</td>
        <td style="font-weight:${row.is_me ? '700' : '500'}">${escapeHtml(row.full_name)}${row.is_me ? ' <span class="badge badge-primary" style="margin-left:6px">Kamu</span>' : ''}</td>
        <td style="text-align:right;font-weight:700;color:var(--primary)">${fmt(row.value)}</td>
      </tr>
    `).join('');
  }

  if (res.my_rank) {
    const card = document.getElementById('my-rank-card');
    card.style.display = 'block';
    document.getElementById('my-rank-badge').textContent = `#${res.my_rank.rank}`;
    document.getElementById('my-rank-text').textContent =
      `Peringkat ${res.my_rank.rank} dari ${res.my_rank.total} — ${TABS[currentTab].format(res.my_rank.value)}`;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

init();
</script>
</body>
</html>
