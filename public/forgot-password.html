<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c9f3e4">
<title>Lupa Password — AustinPay</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/austin-ui.css">
  <link rel="stylesheet" href="/css/austin-desktop.css">
  <link rel="stylesheet" href="/fa/css/all.min.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><i class="fas fa-key"></i></div>
      <h1>Lupa Password</h1>
      <p id="subtitle">Masukkan email akun kamu, kami kirim kode reset.</p>
    </div>

    <div id="alert-box"></div>

    <!-- Langkah 1: minta kode -->
    <form id="request-form" autocomplete="off">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="email@kamu.com" required>
      </div>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAADsmh6EEBbs8ichh" data-callback="onTurnstileSuccess"></div>
      <button type="submit" class="btn btn-primary btn-full btn-lg mt-8" id="request-btn" disabled>
        <i class="fas fa-paper-plane"></i> Kirim Kode
      </button>
    </form>

    <!-- Langkah 2: kode + password baru -->
    <form id="reset-form" autocomplete="off" style="display:none">
      <div class="form-group">
        <label class="form-label">Kode dari Email</label>
        <input type="text" class="form-control" id="code" inputmode="numeric" pattern="\d*" maxlength="6"
               placeholder="123456" autocomplete="one-time-code"
               style="text-align:center;font-size:24px;letter-spacing:8px;font-weight:700" required>
        <p class="form-hint">Kode berlaku 10 menit. Cek juga folder spam.</p>
      </div>
      <div class="form-group">
        <label class="form-label">Password Baru</label>
        <div class="input-group">
          <input type="password" class="form-control" id="new_password" placeholder="min. 6 karakter" required>
          <span class="input-addon" id="toggle-pass" style="cursor:pointer"><i class="fas fa-eye" id="eye-icon" style="pointer-events:none"></i></span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Konfirmasi Password Baru</label>
        <input type="password" class="form-control" id="confirm_password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg mt-8" id="reset-btn">
        <i class="fas fa-check"></i> Reset Password
      </button>
      <p class="text-sm text-muted" style="text-align:center;margin-top:12px">
        Tidak menerima kode?
        <a href="#" id="back-link" style="color:var(--primary);font-weight:600">Kirim ulang</a>
      </p>
    </form>

    <div class="divider"></div>
    <p class="text-sm text-muted" style="text-align:center">
      Ingat password? <a href="/login" style="color:var(--primary);font-weight:600">Masuk</a>
    </p>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/dock.js"></script>
<script>
  const alertBox = document.getElementById('alert-box');
  const requestForm = document.getElementById('request-form');
  const resetForm = document.getElementById('reset-form');
  const codeInput = document.getElementById('code');
  let targetEmail = '';

  function showAlert(type, msg) {
    const icon = type === 'success' ? 'check-circle' : (type === 'warning' ? 'exclamation-triangle' : 'exclamation-circle');
    alertBox.innerHTML = '<div class="alert alert-' + type + '"><i class="fas fa-' + icon + '"></i> </div>';
    alertBox.firstChild.appendChild(document.createTextNode(msg));
  }

  // Tombol "Bukan saya" di email login mengarahkan ke sini: isi email otomatis + beri penjelasan.
  (function prefillFromQuery() {
    const params = new URLSearchParams(location.search);
    const email = (params.get('email') || '').trim().toLowerCase();
    if (email && /^\S+@\S+\.\S+$/.test(email) && email.length <= 254) {
      document.getElementById('email').value = email;
    }
    if (params.get('from') === 'not_me') {
      showAlert('warning', 'Semua perangkat sudah dikeluarkan. Selesaikan captcha lalu kirim kode untuk membuat password baru.');
    }
  })();

  function onTurnstileSuccess() {
    document.getElementById('request-btn').disabled = false;
  }

  function resetCaptcha() {
    if (window.turnstile) {
      turnstile.reset();
      document.getElementById('request-btn').disabled = true;
    }
  }

  codeInput.addEventListener('input', () => {
    codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
  });

  document.getElementById('toggle-pass').addEventListener('click', (e) => {
    e.preventDefault();
    const inp = document.getElementById('new_password');
    const icon = document.getElementById('eye-icon');
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    icon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
  });

  document.getElementById('back-link').addEventListener('click', (e) => {
    e.preventDefault();
    alertBox.innerHTML = '';
    resetForm.style.display = 'none';
    requestForm.style.display = '';
    document.getElementById('subtitle').textContent = 'Masukkan email akun kamu, kami kirim kode reset.';
    resetCaptcha();
  });

  requestForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('request-btn');
    alertBox.innerHTML = '';
    btnLoading(btn, true);

    const email = document.getElementById('email').value.trim().toLowerCase();
    const res = await API.post('/api/auth/forgot-password', {
      email,
      'cf-turnstile-response': document.querySelector('[name="cf-turnstile-response"]')?.value || '',
    });
    btnLoading(btn, false);

    if (res.success) {
      targetEmail = email;
      requestForm.style.display = 'none';
      resetForm.style.display = '';
      document.getElementById('subtitle').textContent = 'Masukkan kode dari email dan buat password baru.';
      showAlert('success', res.message);
      codeInput.focus();
    } else {
      showAlert('danger', res.message || 'Gagal mengirim kode');
      resetCaptcha();
    }
  });

  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('reset-btn');
    alertBox.innerHTML = '';

    const code = codeInput.value;
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('confirm_password').value;

    if (!/^\d{6}$/.test(code)) return showAlert('warning', 'Kode harus 6 digit angka');
    if (newPassword.length < 6) return showAlert('warning', 'Password minimal 6 karakter');
    if (newPassword !== confirmPassword) return showAlert('danger', 'Konfirmasi password tidak cocok');

    btnLoading(btn, true);
    const res = await API.post('/api/auth/reset-password', { email: targetEmail, code, new_password: newPassword });
    btnLoading(btn, false);

    if (res.success) {
      showAlert('success', res.message);
      Toast.success('Password berhasil direset');
      setTimeout(() => { window.location.href = res.redirect || '/login'; }, 1500);
    } else {
      showAlert('danger', res.message || 'Reset password gagal');
    }
  });
</script>
</body>
</html>
