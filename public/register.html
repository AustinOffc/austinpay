<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c9f3e4">
<title>Daftar — AustinPay</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/austin-ui.css">
  <link rel="stylesheet" href="/css/austin-desktop.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/fa/css/all.min.css" id="fa-local">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    // Remove local FA link if CDN loaded successfully
    document.querySelector('#fa-local') && (function(){
      var t=document.querySelector('link[href*="jsdelivr"][href*="fontawesome"]');
      t&&t.addEventListener('load',function(){var l=document.getElementById('fa-local');l&&l.parentNode.removeChild(l);});
    })();
  </script>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><i class="fas fa-bolt"></i></div>
      <h1>Buat Akun</h1>
      <p>Daftar dan mulai gunakan Austin Payment. Kami akan kirim kode verifikasi ke email kamu.</p>
    </div>

    <div id="alert-box"></div>

    <form id="register-form" autocomplete="off">
      <div class="form-group">
        <label class="form-label">Nama Lengkap</label>
        <input type="text" class="form-control" id="full_name" placeholder="Nama kamu" required>
      </div>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="username" placeholder="min. 3 karakter, huruf & angka" required>
        <p class="form-hint">Hanya huruf kecil, angka, dan underscore.</p>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="email@kamu.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" placeholder="min. 6 karakter" required>
          <span class="input-addon" id="toggle-pass" style="cursor:pointer"><i class="fas fa-eye" id="eye-icon" style="pointer-events:none"></i></span>
        </div>
      </div>
      <label class="trust-check" for="trust-device">
        <input type="checkbox" id="trust-device">
        <span>Percaya perangkat ini<small>Jangan kirim email notifikasi login untuk perangkat ini. Jangan dicentang di perangkat umum.</small></span>
      </label>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAADsmh6EEBbs8ichh" data-callback="onTurnstileSuccess"></div>
      <button type="submit" class="btn btn-primary btn-full btn-lg mt-8" id="reg-btn" disabled>
        <i class="fas fa-user-plus"></i> Daftar Sekarang
      </button>
    </form>

    <div class="divider"></div>
    <p class="text-sm text-muted" style="text-align:center">
      Sudah punya akun? <a href="/login" style="color:var(--primary);font-weight:600">Masuk</a>
    </p>

    <div data-apk-wrap>
      <div class="divider divider-dashed"></div>
      <a href="/download/apk" class="btn btn-apk btn-full btn-lg" id="apk-download-btn" download>
        <i class="fab fa-android"></i> Unduh Aplikasi Android (.APK)
      </a>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/dock.js"></script>
<script>
  ApkPromo.initAuthButton();

  function onTurnstileSuccess() {
    document.getElementById('reg-btn').disabled = false;
  }

  function togglePass() {
    const inp = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.className = 'fas fa-eye-slash';
    } else {
      inp.type = 'password';
      icon.className = 'fas fa-eye';
    }
  }

  const toggleBtn = document.getElementById('toggle-pass');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      togglePass();
    });
  }

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('reg-btn');
    const alertBox = document.getElementById('alert-box');
    alertBox.innerHTML = '';
    btnLoading(btn, true);

    const res = await API.post('/api/auth/register', {
      full_name: document.getElementById('full_name').value,
      username: document.getElementById('username').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      'cf-turnstile-response': document.querySelector('[name="cf-turnstile-response"]')?.value || '',
    });

    btnLoading(btn, false);
    if (res.success && res.need_verification) {
      try {
        sessionStorage.setItem('verify_email', res.email);
        sessionStorage.setItem('verify_sent', res.email_sent ? '1' : '0');
        sessionStorage.setItem('verify_trust', document.getElementById('trust-device').checked ? '1' : '0');
      } catch (err) {}
      Toast.success(res.message);
      setTimeout(() => window.location.href = '/verify-email', 600);
    } else if (res.success) {
      Toast.success('Registrasi berhasil!');
      FreshLogin.mark();
      setTimeout(() => window.location.href = res.redirect, 600);
    } else {
      alertBox.innerHTML = `<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> ${res.message}</div>`;
      if (window.turnstile) {
        turnstile.reset();
        document.getElementById('reg-btn').disabled = true;
      }
    }
  });
</script>
</body>
</html>
