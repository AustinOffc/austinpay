<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c9f3e4">
<title>Login — AustinPay</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/austin-ui.css">
  <link rel="stylesheet" href="/css/austin-desktop.css">
  <link rel="stylesheet" href="/fa/css/all.min.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script></head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><i class="fas fa-bolt"></i></div>
      <h1>Austin Payment</h1>
      <p>Masuk ke akun kamu</p>
    </div>

    <div id="alert-box"></div>

    <form id="login-form" autocomplete="off">
      <div class="form-group">
        <label class="form-label">Username atau Email</label>
        <input type="text" class="form-control" id="identifier" placeholder="username atau email" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" placeholder="••••••••" required>
          <span class="input-addon" id="toggle-pass" style="cursor:pointer"><i class="fas fa-eye" id="eye-icon" style="pointer-events:none"></i></span>
        </div>
        <p class="form-hint" style="text-align:right"><a href="/forgot-password" style="color:var(--primary);font-weight:600">Lupa password?</a></p>
      </div>
      <label class="trust-check" for="trust-device">
        <input type="checkbox" id="trust-device">
        <span>Percaya perangkat ini</span>
      </label>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAADsmh6EEBbs8ichh" data-callback="onTurnstileSuccess"></div>
      <button type="submit" class="btn btn-primary btn-full btn-lg mt-8" id="login-btn" disabled>
        <i class="fas fa-sign-in-alt"></i> Masuk
      </button>
    </form>

    <div class="divider"></div>
    <p class="text-sm text-muted" style="text-align:center">
      Belum punya akun? <a href="/register" style="color:var(--primary);font-weight:600">Daftar sekarang</a>
    </p>

    <div data-apk-wrap>
      <div class="divider divider-dashed"></div>
      <a href="/download/apk" class="btn btn-apk btn-full btn-lg" id="apk-download-btn" download>
        <i class="fab fa-android"></i> Unduh Aplikasi Android (.APK)
      </a>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/dock.js"></script>
<script>
  (async () => {
    const res = await API.get('/api/auth/me');
    if (res.success) {
      window.location.href = res.user.role === 'admin' ? '/austinganteng' : '/dashboard';
    }
  })();

  ApkPromo.initAuthButton();

  function onTurnstileSuccess() {
    document.getElementById('login-btn').disabled = false;
  }

  function togglePass() {
    const inp = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.className = 'fas fa-eye-slash';
    } else {
      inp.type = 'password';
      icon.className = 'fas fa-eye';
    }
  }

  const toggleBtn = document.getElementById('toggle-pass');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      togglePass();
    });
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const alertBox = document.getElementById('alert-box');
    alertBox.innerHTML = '';
    btnLoading(btn, true);

    const res = await API.post('/api/auth/login', {
      identifier: document.getElementById('identifier').value,
      password: document.getElementById('password').value,
      trust_device: document.getElementById('trust-device').checked,
      'cf-turnstile-response': document.querySelector('[name="cf-turnstile-response"]')?.value || '',
    });

    btnLoading(btn, false);

    if (res.success) {
      Toast.success(res.message);
      FreshLogin.mark();
      setTimeout(() => window.location.href = res.redirect, 500);
    } else if (res.need_verification) {
      try {
        sessionStorage.setItem('verify_email', res.email);
        sessionStorage.setItem('verify_sent', res.email_sent ? '1' : '0');
        sessionStorage.setItem('verify_trust', document.getElementById('trust-device').checked ? '1' : '0');
      } catch (err) {}
      window.location.href = '/verify-email';
    } else {
      alertBox.innerHTML = `<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> ${res.message}</div>`;
      if (window.turnstile) {
        turnstile.reset();
        document.getElementById('login-btn').disabled = true;
      }
    }
  });

  const params = new URLSearchParams(location.search);
  if (params.get('err') === 'suspended') {
    document.getElementById('alert-box').innerHTML = `<div class="alert alert-danger"><i class="fas fa-ban"></i> Akun kamu telah disuspend.</div>`;
  }
</script>
</body>
</html>
